<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Code Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #080c14;
    --surface: #0d1421;
    --surface2: #111927;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #7b5ea7;
    --critical: #ff4757;
    --warning: #ffa502;
    --suggestion: #2ed573;
    --text: #e8f4fd;
    --muted: #5a7a9a;
    --glow: 0 0 20px rgba(0, 212, 255, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 0;
    background: rgba(8,12,20,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .logo-text span { color: var(--accent); }

  .status-dot {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--suggestion);
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(46,213,115,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(46,213,115,0); }
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin: 32px 0;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }

  .stat-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--glow);
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .stat-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .stat-value.critical { color: var(--critical); }
  .stat-value.warning { color: var(--warning); }
  .stat-value.suggestion { color: var(--suggestion); }
  .stat-value.accent { color: var(--accent); }

  /* Reviews list */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .refresh-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    background: none;
    border: 1px solid var(--accent);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .refresh-btn:hover { background: rgba(0,212,255,0.08); }

  .reviews-list { display: flex; flex-direction: column; gap: 12px; }

  .review-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .review-card:hover {
    border-color: rgba(0,212,255,0.4);
    box-shadow: var(--glow);
  }

  .review-card.active { border-color: var(--accent); }

  .review-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .review-repo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .review-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
  }

  .review-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .badge-critical { background: rgba(255,71,87,0.15); color: var(--critical); border: 1px solid rgba(255,71,87,0.3); }
  .badge-warning { background: rgba(255,165,2,0.15); color: var(--warning); border: 1px solid rgba(255,165,2,0.3); }
  .badge-suggestion { background: rgba(46,213,115,0.15); color: var(--suggestion); border: 1px solid rgba(46,213,115,0.3); }
  .badge-running { background: rgba(0,212,255,0.15); color: var(--accent); border: 1px solid rgba(0,212,255,0.3); }
  .badge-failed { background: rgba(255,71,87,0.1); color: #ff6b81; border: 1px solid rgba(255,71,87,0.2); }
  .badge-completed { background: rgba(46,213,115,0.1); color: var(--suggestion); border: 1px solid rgba(46,213,115,0.2); }

  .review-author {
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* Detail panel */
  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 12px;
    overflow: hidden;
    display: none;
  }

  .detail-panel.open { display: block; }

  .detail-summary {
    padding: 20px 24px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.7;
    color: #a8c8e8;
  }

  .findings-list { padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }

  .finding {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 12px;
    align-items: start;
    padding: 12px 16px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 13px;
  }

  .finding.critical { border-left: 3px solid var(--critical); }
  .finding.warning { border-left: 3px solid var(--warning); }
  .finding.suggestion { border-left: 3px solid var(--suggestion); }

  .finding-location {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .finding-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    background: rgba(123,94,167,0.15);
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  .finding-comment { line-height: 1.6; color: #c8dff0; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 40px;
    color: var(--muted);
  }

  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .empty-sub { font-size: 14px; font-family: 'JetBrains Mono', monospace; }

  /* Loading */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-bar {
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: shimmer 1.5s ease infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }

  footer {
    margin-top: 60px;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 768px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .finding { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div class="logo-text">AI<span>Review</span>Bot</div>
    </div>
    <div class="status-dot">
      <div class="dot"></div>
      <span id="status-text">Connecting...</span>
    </div>
  </div>
</header>

<div class="container" style="padding-top: 32px; padding-bottom: 32px;">

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Reviews</div>
      <div class="stat-value accent" id="stat-total">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Critical Found</div>
      <div class="stat-value critical" id="stat-critical">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Warnings</div>
      <div class="stat-value warning" id="stat-warning">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Suggestions</div>
      <div class="stat-value suggestion" id="stat-suggestion">–</div>
    </div>
  </div>

  <!-- Reviews -->
  <div class="section-header">
    <div class="section-title">Recent Reviews</div>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>

  <div class="reviews-list" id="reviews-list">
    <div class="empty">
      <div class="spinner"></div>
      <p style="margin-top:16px; color: var(--muted); font-family: monospace; font-size:13px;">Loading reviews...</p>
    </div>
  </div>

</div>

<footer>
  <div class="container">
    Powered by Claude AI · AST Analysis · Custom Rules Engine
  </div>
</footer>

<script>
  let activeCard = null;

  async function loadStats() {
    try {
      const res = await fetch('/api/stats');
      const data = await res.json();
      document.getElementById('stat-total').textContent = data.total_reviews ?? 0;
      document.getElementById('stat-critical').textContent = data.critical_findings ?? 0;
      document.getElementById('stat-warning').textContent = data.warning_findings ?? 0;
      document.getElementById('stat-suggestion').textContent =
        (data.total_findings ?? 0) - (data.critical_findings ?? 0) - (data.warning_findings ?? 0);
      document.getElementById('status-text').textContent = 'Live · ' + new Date().toLocaleTimeString();
    } catch(e) {
      document.getElementById('status-text').textContent = 'Server offline';
    }
  }

  function severityBadge(sev, count) {
    if (!count) return '';
    const cls = `badge-${sev}`;
    const icons = { critical: '🚨', warning: '⚠️', suggestion: '💡' };
    return `<span class="badge ${cls}">${icons[sev]} ${count} ${sev}</span>`;
  }

  function statusBadge(status) {
    const map = {
      running: '<span class="badge badge-running"><span class="spinner"></span> Running</span>',
      completed: '<span class="badge badge-completed">✓ Completed</span>',
      failed: '<span class="badge badge-failed">✗ Failed</span>',
      skipped: '<span class="badge badge-warning">– Skipped</span>',
    };
    return map[status] || `<span class="badge">${status}</span>`;
  }

  function renderFinding(f) {
    const sev = f.severity || 'suggestion';
    const icons = { critical: '🚨', warning: '⚠️', suggestion: '💡' };
    return `
      <div class="finding ${sev}">
        <div class="finding-location">${f.file || '?'}:${f.line || '?'}</div>
        <div class="finding-source">${f.source || 'AI'}</div>
        <div class="finding-comment">${icons[sev]} <strong>[${sev.toUpperCase()}]</strong> ${f.comment || ''}</div>
      </div>`;
  }

  function renderReview(r) {
    const stats = r.stats || {};
    const el = document.createElement('div');
    el.innerHTML = `
      <div class="review-card" id="card-${r.id}">
        <div class="review-header">
          <div>
            <div class="review-repo">${r.repo} #${r.pr_number}</div>
            <div class="review-title">${r.pr_title || 'Untitled PR'}</div>
          </div>
          ${statusBadge(r.status)}
        </div>
        <div class="review-meta">
          ${severityBadge('critical', stats.critical)}
          ${severityBadge('warning', stats.warning)}
          ${severityBadge('suggestion', stats.suggestion)}
          <span class="review-author">@${r.author || 'unknown'}</span>
          <span class="review-author">${r.started_at ? new Date(r.started_at).toLocaleString() : ''}</span>
        </div>
      </div>
      <div class="detail-panel" id="detail-${r.id}">
        ${r.summary ? `<div class="detail-summary">${r.summary}</div>` : ''}
        ${r.status === 'running' ? '<div class="loading-bar"></div><p style="padding:16px;text-align:center;color:var(--muted);font-size:13px;">Analysis in progress...</p>' : ''}
        ${r.error ? `<div style="padding:16px;color:var(--critical);font-family:monospace;font-size:12px;">Error: ${r.error}</div>` : ''}
        <div class="findings-list">
          ${(r.findings || []).map(renderFinding).join('') || (r.status === 'completed' ? '<p style="color:var(--suggestion);text-align:center;padding:16px;">✅ No issues found!</p>' : '')}
        </div>
      </div>`;

    const card = el.querySelector('.review-card');
    const detail = el.querySelector('.detail-panel');
    card.addEventListener('click', () => {
      const isOpen = detail.classList.contains('open');
      // Close all
      document.querySelectorAll('.detail-panel.open').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.review-card.active').forEach(c => c.classList.remove('active'));
      if (!isOpen) {
        detail.classList.add('open');
        card.classList.add('active');
      }
    });

    return el;
  }

  async function loadData() {
    await loadStats();
    try {
      const res = await fetch('/api/reviews');
      const reviews = await res.json();
      const list = document.getElementById('reviews-list');

      if (!reviews.length) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">No reviews yet</div>
            <div class="empty-sub">Open a Pull Request in your connected repo to trigger the first review.</div>
          </div>`;
        return;
      }

      list.innerHTML = '';
      reviews.forEach(r => list.appendChild(renderReview(r)));
    } catch(e) {
      document.getElementById('reviews-list').innerHTML =
        `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load reviews</div><div class="empty-sub">${e.message}</div></div>`;
    }
  }

  // Auto-refresh every 10 seconds
  loadData();
  setInterval(loadData, 10000);
</script>
</body>
</html>
